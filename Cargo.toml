[package]
name = "toadchat"
version = "0.1.0"
edition = "2024"
description = "A refined native XMPP messenger built with Rust and egui"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui-wgpu = { version = "0.31.1", default-features = false, features = ["winit"] }
rfd = "0.15"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
wgpu = { version = "24", default-features = false, features = ["wgsl"] }
xmpp = "0.7"
